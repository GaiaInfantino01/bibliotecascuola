<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Catalogo libri – BiblioLeo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<header class="site-header">
  <img src="https://i.imgur.com/FPxZ91O.png" alt="BiblioLeo – Biblioteca IIS Leonardo">
</header>

<main class="container">

 <!-- RICERCA -->
<input type="text" id="search" placeholder="Cerca per titolo, autore, genere, ISBN...">

<!-- FILTRI -->
<div class="filters">

  <select id="genre-filter">
    <option value="">Tutti i generi</option>
  </select>

  <select id="availability-filter">
    <option value="">Tutti</option>
    <option value="disponibile">Disponibili</option>
    <option value="non disponibile">Non disponibili</option>
  </select>

  <select id="sort-filter">
    <option value="">Ordine originale</option>
    <option value="titolo">Titolo A-Z</option>
    <option value="autore">Autore A-Z</option>
    <option value="anno">Anno</option>
  </select>

</div>

<!-- CONTATORE -->
<p id="counter" class="counter"></p>

<p class="hint">Clicca su un libro per aprire la scheda completa</p>

<ul id="results"></ul>

  <!-- LISTA PREFERITI -->
  <h3>📌 Libri preferiti</h3>
  <ul id="favorites-list"></ul>

</main>

<script src="script.js"></script>
</body>
</html>
